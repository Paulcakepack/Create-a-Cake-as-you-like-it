<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Dancing+Script:wght@700&family=Great+Vibes&family=Lobster&family=Righteous&display=swap" rel="stylesheet">
<title>Create a Cake — Sugar Sisters</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--pk:#e91e8c;--pklt:#fff0f8;--gn:#2e9e6b;--bd:#e0e0e0;--sf:#f7f7f7}
body{background:#e8e8e8;overflow-x:hidden}
body.embedded{background:#fff}
.hdr{background:#fff;border-bottom:3px solid var(--pk);padding:6px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:sticky;top:0;z-index:99}
.cart{background:var(--pk);color:#fff;border:none;border-radius:4px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer}
.steps{display:flex;background:#fff;border-bottom:2px solid var(--bd);align-items:center}
.st-sep{color:#ddd;font-size:16px;font-weight:300;flex-shrink:0;pointer-events:none;user-select:none}
.st{flex:1;padding:10px 3px;text-align:center;font-size:9px;font-weight:800;color:#bbb;cursor:pointer;border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:.04em;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.st.a{color:var(--pk);border-bottom-color:var(--pk)}
.st.d{color:var(--gn)}
.st b{display:block;font-size:15px;margin-bottom:1px}
.wrap{display:grid;grid-template-columns:320px minmax(0,600px);align-items:center;justify-content:center;min-height:100vh;max-width:1000px;margin:0 auto;gap:20px}
.side{background:#fff;border-right:1px solid var(--bd);overflow-y:auto;max-height:100vh;align-self:center}
.pnl{display:none;padding:10px 12px}
.pnl.a{display:block}
@media(max-width:480px){
  html,body{background:#fff!important;margin:0;padding:0}
  .wrap{grid-template-columns:1fr;min-height:auto;position:relative;background:#fff}
  .pv{width:100%!important;padding:4px 4px 12px 4px!important;order:1;background:#fff!important;min-height:0!important;height:auto!important;flex:0 0 auto!important}
  .cw-wrap{max-width:100%;margin:0 auto;width:100%}
  .side{position:fixed;bottom:0;left:0;right:0;z-index:260;height:auto;max-height:85vh;background:#fff;border-right:none;border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(233,30,140,0.25);overflow-y:auto;transform:translateY(calc(100% - 56px));transition:transform .35s cubic-bezier(.4,0,.2,1);order:2;padding-bottom:80px;-webkit-overflow-scrolling:touch}
  .side.open{transform:translateY(0)}
  .side::before{display:none}
